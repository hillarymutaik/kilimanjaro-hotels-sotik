# Render blueprint: Render > New > Blueprint, then pick this repo.
services:
  - type: web
    name: kilimanjaro-hotels-sotik
    runtime: node
    plan: starter            # persistent disks need a paid plan
    region: frankfurt
    branch: master
    autoDeploy: false        # GitHub Actions deploys after the build passes
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/site
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for it when you create the blueprint
    disk:
      name: hotel-data
      mountPath: /var/data
      sizeGB: 1
