<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5246" />
    <meta
      name="description"
      content="Kilimanjaro Hotels Sotik: comfortable rooms, hot meals and friendly service in Sotik, Bomet County, Kenya. Check availability and book your stay."
    />
    <script>
      // Apply the saved theme (default light) before React mounts to avoid a flash.
      try {
        var t = localStorage.getItem('khs-theme');
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Kilimanjaro Hotels Sotik | Book your stay</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
