name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily visit so the free Supabase project isn't paused for inactivity.
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'schedule' && 'supabase-keepalive' || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        env:
          VITE_STATIC: '1'
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repo variables (Settings > Secrets and variables > Actions > Variables).
          # With both Supabase values set, the site uses live data and the admin panel is included.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Only used without Supabase: where /admin/ should send staff (a hotel PC).
          ADMIN_URL: ${{ vars.ADMIN_URL }}
        run: npm run build:static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  keep-supabase-awake:
    if: github.event_name == 'schedule' && vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Call the database
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "$URL/rest/v1/rpc/get_site" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "Supabase answered."
