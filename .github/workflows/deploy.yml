name: Build and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Start the real server against a throwaway database and check it answers.
      - name: Smoke test
        env:
          DATA_DIR: ${{ runner.temp }}/data
          PORT: 3001
          ADMIN_PASSWORD: ci-only-password
        run: |
          node server/index.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3001/api/site > /dev/null; then
              curl -fsS http://localhost:3001/ | grep -qi '<div id="root"' && echo "Server OK" && exit 0
            fi
            sleep 1
          done
          echo "Server did not respond"; cat server.log; exit 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Add the RENDER_DEPLOY_HOOK_URL secret (Render > service > Settings > Deploy Hook)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK?ref=${{ github.sha }}"
          echo "Render deploy triggered for ${{ github.sha }}"
